[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopulse"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3.0",
    "yfinance>=0.2.40,<0.3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "scikit-learn>=1.4,<2.0",
    "torch>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<0.7",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
    "pandas-stubs>=2.1,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle core, I = import sorting, UP = pyupgrade
# (flags outdated syntax), B = bugbear (catches likely bugs, not just style)
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Pinned to 3.12, not our requires-python floor of 3.10: numpy's own
# bundled .pyi stubs now use PEP 695 `type` statements, which mypy can
# only parse when the checker's target version is 3.12+. This is a
# checker/stub-syntax constraint, not a claim that our code needs 3.12 --
# requires-python above is still the real compatibility floor for users.
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
# yfinance ships no py.typed marker / stub package, so mypy can't check
# calls into it. ignore_missing_imports is scoped to this one module,
# not set globally -- we still want mypy strict everywhere we control.
module = "yfinance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn ships no py.typed marker either. Same scoping rationale.
module = "sklearn.*"
ignore_missing_imports = true
